<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" xmlns:c2pa="http://c2pa.org/manifest">
<defs><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:Impact,'Arial Black',sans-serif}
.b{font-family:'Trebuchet MS',Verdana,sans-serif}
@keyframes in{from{transform:translateX(-950px)}to{transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.p1{animation:in .6s cubic-bezier(.2,.9,.2,1) both}
.p2{animation:in .8s .1s cubic-bezier(.2,.9,.2,1) both}
.tx{animation:fade .8s .7s both}
.pl{animation:pulse 2s infinite}
</style></defs>
<rect width="900" height="330" fill="#050505"/>
<g class="p1"><polygon points="20,18 880,8 870,60 10,66" fill="#e60012"/></g>
<g class="p1"><text x="44" y="52" class="t" font-size="34" fill="#fff" letter-spacing="2" transform="skewX(-8) translate(8 0)">CALLING CARD</text></g>
<g class="p2"><polygon points="10,84 890,76 880,316 22,322" fill="#0e0e0e" stroke="#e60012" stroke-width="3"/><polygon points="10,84 70,82 52,322 22,322" fill="#e60012" opacity=".9"/></g>
<g class="tx b" font-size="18" fill="#fff">
<text x="92" y="122">I’m a software developer with a strong curiosity for how</text>
<text x="92" y="152">things work beneath the surface. My interests span software</text>
<text x="92" y="182">engineering, systems programming, game development, and</text>
<text x="92" y="212">computer hardware. I enjoy exploring unfamiliar technologies,</text>
<text x="92" y="242">solving challenging problems, and building things that go</text>
<text x="92" y="272">beyond the ordinary abstractions. Always learning,</text>
<text x="92" y="302">experimenting, and finding new ways to turn ideas into reality.</text>
</g>
<polygon class="pl" points="835,300 880,300 880,255" fill="#e60012" filter="url(#g)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
