<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:Impact,'Arial Black',sans-serif}
.m{font-family:'Courier New',monospace}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.35}50%{opacity:1}52%{opacity:.6}54%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(340px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes slide{from{transform:translateX(-1100px)}to{transform:translateX(0)}}
@keyframes slideR{from{transform:translateX(1100px)}to{transform:translateX(0)}}
.s1{animation:slide .7s cubic-bezier(.2,.9,.2,1) both}
.s2{animation:slide .9s .1s cubic-bezier(.2,.9,.2,1) both}
.s3{animation:slideR .9s .2s cubic-bezier(.2,.9,.2,1) both}
.flick{animation:flick 4s 1.2s infinite}
.spin{transform-origin:850px 160px;animation:spin 14s linear infinite}
.spin2{transform-origin:850px 160px;animation:spin 9s linear infinite reverse}
.pulse{transform-origin:850px 160px;animation:pulse 2.4s ease-in-out infinite}
.scan{animation:scan 5s linear infinite}
.blink{animation:blink 1s steps(1) infinite}
</style>
</defs>
