<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest">
<defs><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:Impact,'Arial Black',sans-serif}
@keyframes hl{0%,24%{opacity:1}25%,100%{opacity:0}}
@keyframes hlt{0%,24%{fill:#050505}25%,100%{fill:#fff}}
@keyframes bob{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes in{from{transform:translateX(-950px)}to{transform:translateX(0)}}
.i1,.i2,.i3,.i4{animation:in .7s cubic-bezier(.2,.9,.2,1) both}
.i2{animation-delay:.1s}.i3{animation-delay:.2s}.i4{animation-delay:.3s}
.h{opacity:0;animation:hl 8s infinite}
.ht{animation:hlt 8s infinite}
.d2{animation-delay:2s}.d3{animation-delay:4s}.d4{animation-delay:6s}
.cur{animation:hl 8s infinite,bob .8s ease-in-out infinite}
.cur.d2{animation-delay:2s,0s}.cur.d3{animation-delay:4s,0s}.cur.d4{animation-delay:6s,0s}
</style></defs>
<rect width="900" height="360" fill="#050505"/>
<polygon points="0,0 900,0 900,48 0,60" fill="#ffd400"/>
<text x="30" y="40" class="t" font-size="30" fill="#000" letter-spacing="3" transform="skewX(-8)">SKILLS / ABILITIES</text>
<g class="i1"><polygon points="30,80 870,74 860,142 40,148" fill="#161616"/><g class="h"><polygon points="30,80 870,74 860,142 40,148" fill="#ffd400" filter="url(#g)"/></g><g class="cur h"><polygon points="2,97 22,111 2,125" fill="#050505"/></g><text x="80" y="125" class="t ht" font-size="38" fill="#fff" letter-spacing="2">WEB DEVELOPMENT</text></g>
<g class="i2"><polygon points="30,158 870,152 860,220 40,226" fill="#161616"/><g class="h d2"><polygon points="30,158 870,152 860,220 40,226" fill="#ffd400" filter="url(#g)"/></g><g class="cur h d2"><polygon points="2,175 22,189 2,203" fill="#050505"/></g><text x="80" y="203" class="t ht d2" font-size="38" fill="#fff" letter-spacing="2">SYSTEMS PROGRAMMING</text></g>
<g class="i3"><polygon points="30,236 870,230 860,298 40,304" fill="#161616"/><g class="h d3"><polygon points="30,236 870,230 860,298 40,304" fill="#ffd400" filter="url(#g)"/></g><g class="cur h d3"><polygon points="2,253 22,267 2,281" fill="#050505"/></g><text x="80" y="281" class="t ht d3" font-size="38" fill="#fff" letter-spacing="2">GAME DEVELOPMENT</text></g>
<g class="i4"><polygon points="30,314 870,308 860,352 40,356" fill="#161616"/><g class="h d4"><polygon points="30,314 870,308 860,352 40,356" fill="#ffd400" filter="url(#g)"/></g><g class="cur h d4"><polygon points="2,319 22,333 2,347" fill="#050505"/></g><text x="80" y="345" class="t ht d4" font-size="30" fill="#fff" letter-spacing="2">COMPUTER HARDWARE</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>