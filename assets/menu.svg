<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest">
<defs><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.t{font-family:Impact,'Arial Black',sans-serif}
.m{font-family:'Courier New',monospace}
@keyframes hl{0%,24%{opacity:1}25%,100%{opacity:0}}
@keyframes hlt{0%,24%{fill:#050505}25%,100%{fill:#fff}}
@keyframes bob{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
@keyframes in{from{transform:translateX(-950px)}to{transform:translateX(0)}}
.i1,.i2,.i3,.i4{animation:in .7s cubic-bezier(.2,.9,.2,1) both}
.i2{animation-delay:.1s}.i3{animation-delay:.2s}.i4{animation-delay:.3s}
.h{opacity:0;animation:hl 8s infinite}
.ht{animation:hlt 8s infinite}
.d2{animation-delay:2s}.d3{animation-delay:4s}.d4{animation-delay:6s}
.cur{animation:bob .8s ease-in-out infinite}
</style></defs>
<rect width="900" height="360" fill="#050505"/>
<polygon points="0,0 900,0 900,48 0,60" fill="#e60012"/>
<text x="30" y="40" class="t" font-size="30" fill="#fff" letter-spacing="3" transform="skewX(-8)">SKILLS / ABILITIES</text>
<g class="i1"><polygon points="30,80 870,74 860,142 40,148" fill="#161616"/><g class="h"><polygon points="30,80 870,74 860,142 40,148" fill="#e60012" filter="url(#g)"/></g><g class="cur h"><polygon points="2,96 22,110 2,124" fill="#fff"/></g><text x="80" y="124" class="t ht" font-size="38" fill="#fff" letter-spacing="2">WEB DEVELOPMENT</text><text x="760" y="122" class="m" font-size="14" fill="#888">LV.MAX</text></g>
<g class="i2"><polygon points="40,158 860,152 850,220 50,226" fill="#161616"/><g class="h d2"><polygon points="40,158 860,152 850,220 50,226" fill="#e60012" filter="url(#g)"/></g><g class="cur h d2"><polygon points="12,174 32,188 12,202" fill="#fff"/></g><text x="90" y="202" class="t ht d2" font-size="38" fill="#fff" letter-spacing="2">SYSTEMS PROGRAMMING</text></g>
<g class="i3"><polygon points="30,236 870,230 860,298 40,304" fill="#161616"/><g class="h d3"><polygon points="30,236 870,230 860,298 40,304" fill="#e60012" filter="url(#g)"/></g><g class="cur h d3"><polygon points="2,252 22,266 2,280" fill="#fff"/></g><text x="80" y="280" class="t ht d3" font-size="38" fill="#fff" letter-spacing="2">GAME DEVELOPMENT</text></g>
<g class="i4"><polygon points="40,314 860,308 856,352 44,356" fill="#161616"/><g class="h d4"><polygon points="40,314 860,308 856,352 44,356" fill="#e60012" filter="url(#g)"/></g><g class="cur h d4"><polygon points="12,322 30,333 12,344" fill="#fff"/></g><text x="90" y="345" class="t ht d4" font-size="30" fill="#fff" letter-spacing="2">COMPUTER HARDWARE</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
