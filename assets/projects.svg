<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" xmlns:c2pa="http://c2pa.org/manifest">
<defs><style>
.t{font-family:Impact,'Arial Black',sans-serif}
.b{font-family:'Trebuchet MS',Verdana,sans-serif}
.m{font-family:'Courier New',monospace}
@keyframes in{from{transform:translateX(-950px)}to{transform:translateX(0)}}
@keyframes inr{from{transform:translateX(950px)}to{transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.a{animation:in .7s cubic-bezier(.2,.9,.2,1) both}
.c{animation:inr .8s .15s cubic-bezier(.2,.9,.2,1) both}
.pl{animation:pulse 1.6s infinite}
</style></defs>
<rect width="900" height="340" fill="#050505"/>
<polygon points="0,0 900,0 900,48 0,60" fill="#ffd400"/>
<text x="30" y="40" class="t" font-size="30" fill="#000" letter-spacing="3" transform="skewX(-8)">MISSIONS</text>
<g class="a"><polygon points="20,80 880,72 872,172 28,180" fill="#121212" stroke="#fff" stroke-width="2"/><polygon points="20,80 140,78 128,180 28,180" fill="#ffd400"/>
<text x="38" y="150" class="t" font-size="64" fill="#000" transform="skewX(-8)">01</text>
<text x="170" y="112" class="t" font-size="30" fill="#fff" letter-spacing="2">evToenTickets</text>
<text x="170" y="140" class="b" font-size="15" fill="#ddd">Laravel e-ticketing for school events: QR scanner that knows event time,</text>
<text x="170" y="162" class="b" font-size="15" fill="#ddd">admin-verified payment proof, student CRUD, transaction history.</text>
<text x="700" y="100" class="m pl" font-size="13" fill="#ffd400">STATUS: CLEARED</text></g>
<g class="c"><polygon points="28,196 872,190 880,290 20,298" fill="#121212" stroke="#fff" stroke-width="2"/><polygon points="880,190 760,192 772,292 880,290" fill="#ffd400"/>
<text x="790" y="268" class="t" font-size="64" fill="#000" transform="skewX(-8) translate(30 0)">02</text>
<text x="48" y="230" class="t" font-size="30" fill="#fff" letter-spacing="2">Jarvis Terminal Assistant</text>
<text x="48" y="258" class="b" font-size="15" fill="#ddd">A Jarvis-style assistant that lives in your terminal.</text>
<text x="48" y="280" class="m pl" font-size="13" fill="#ffd400">STATUS: PUBLIC</text></g>
<text x="30" y="326" class="m" font-size="12" fill="#888" letter-spacing="2">LARAVEL / PHP / MYSQL / BOOTSTRAP / TERMINAL TOOLING</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
